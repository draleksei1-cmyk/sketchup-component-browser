<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Библиотека компонентов</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="visibility.css" />
  </head>
  <body>
    <div class="library-app" id="app-shell">
      <aside class="library-rail" aria-label="Навигация библиотеки">
        <div class="rail-brand"><img src="../icons/brick.svg" alt="" /> <span>Библиотека</span></div>
        <nav class="scope-nav" aria-label="Разделы">
          <button class="filter-btn active" data-filter="all" type="button">Все</button>
          <button class="filter-btn" data-filter="favorites" type="button">Избранное</button>
          <button class="filter-btn" data-filter="recent" type="button">Недавние</button>
          <button class="filter-btn" data-filter="in_model" type="button">В модели</button>
        </nav>
        <div class="rail-section"><span>Категории</span><button id="category-add" class="icon-button" type="button" aria-label="Добавить категорию"><img src="../icons/folder.svg" alt="" /></button></div>
        <div class="category-list" id="category-list"></div>
        <div class="rail-bottom">
          <button id="save-selected-btn" class="quiet-button" type="button">Сохранить выделенное</button>
          <button id="settings-btn" class="quiet-button" type="button"><img src="../icons/settings.svg" alt="" /> Настройки</button>
        </div>
      </aside>

      <main class="library-main" id="content-root">
        <header class="library-toolbar">
          <label class="search-field"><img src="../icons/open.svg" alt="" /><input id="search" type="search" placeholder="Поиск по имени, тегам, категории" aria-label="Поиск" /></label>
          <button id="refresh-btn" class="icon-button" type="button" aria-label="Обновить список" title="Обновить список"><img src="../icons/refresh.svg" alt="" /></button>
          <div class="size-buttons" role="group" aria-label="Размер карточек">
            <button class="size-btn" data-size="small" type="button">S</button><button class="size-btn active" data-size="medium" type="button">M</button><button class="size-btn" data-size="large" type="button">L</button>
          </div>
          <div class="menu-wrap"><button id="library-overflow" class="icon-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Дополнительные действия"><img src="../icons/more.svg" alt="" /></button>
            <div id="library-overflow-menu" class="popup-menu" role="menu" hidden>
              <button data-command="scan_library_folder" role="menuitem" type="button">Глубокое сканирование</button>
              <button data-command="weight" role="menuitem" type="button">Фильтр по тяжести</button>
              <button data-command="export_pack" role="menuitem" type="button">Экспортировать pack…</button>
              <button data-command="import_pack" role="menuitem" type="button">Импортировать pack…</button>
              <button data-command="settings" role="menuitem" type="button">Настройки</button>
            </div>
          </div>
        </header>
        <div id="status-line" class="status-line" hidden></div>
        <div id="array-pick-banner" class="array-pick-banner" hidden></div>
        <section id="cards-grid" class="cards-grid size-medium" aria-label="Компоненты"></section>
        <div id="empty-state" class="empty-state" hidden>Ничего не найдено</div>
      </main>

      <aside id="details-drawer" class="details-drawer" aria-label="Свойства компонента" aria-hidden="true" hidden>
        <header class="drawer-header"><div><span class="eyebrow">Компонент</span><h2 id="drawer-title">—</h2></div><div><button id="drawer-favorite" class="icon-button" type="button" aria-label="В избранное"><img src="../icons/star.svg" alt="" /></button><button id="drawer-close" class="icon-button" type="button" aria-label="Закрыть свойства"><img src="../icons/close.svg" alt="" /></button></div></header>
        <img id="drawer-preview" class="drawer-preview" alt="Превью выбранного компонента" />
        <button id="primary-insert" class="primary-button" type="button"><img src="../icons/brick.svg" alt="" /> Вставить</button>
        <details open><summary>Размещение</summary><label><input id="opt-surface" type="checkbox" data-insert-opt="place_on_surface" /> Ставить на поверхность</label><label><input id="opt-normal" type="checkbox" data-insert-opt="align_to_normal" /> Повернуть по нормали</label><label><input id="opt-random" type="checkbox" data-insert-opt="random_quadrant" /> Случайный поворот</label><label><input id="opt-ground" type="checkbox" data-insert-opt="drop_to_ground" /> Притянуть к земле</label><button id="drawer-brush" class="text-button" type="button">Многократная вставка</button></details>
        <details><summary>Редактирование</summary><label>Имя<input id="drawer-name" type="text" /></label><label>Категория<select id="drawer-category"></select></label><label>Описание<textarea id="drawer-description" rows="3"></textarea></label><label>Теги<input id="drawer-tags" type="text" placeholder="Через запятую" /></label></details>
        <details><summary>Замена</summary><button id="drawer-replace" class="text-button" type="button">Заменить выделенное</button><button id="drawer-replace-from-selection" class="text-button" type="button">Заменить на выделенное в модели</button></details>
        <details><summary>Обслуживание</summary><button id="drawer-regen" class="text-button" type="button">Пересоздать превью</button><button id="drawer-show-file" class="text-button" type="button">Показать файл</button><button id="drawer-open-folder" class="text-button" type="button">Открыть папку</button></details>
      </aside>
    </div>

    <template id="card-template"><article class="library-card" tabindex="0"><div class="card-preview"><img class="thumb" alt="Превью" /></div><div class="card-copy"><h3 class="name"></h3><p class="meta"></p><div class="tags"></div></div></article></template>
    <div id="card-context-menu" class="popup-menu context-menu" role="menu" hidden><button data-action="insert" role="menuitem" type="button">Вставить</button><button data-action="brush" role="menuitem" type="button">Многократная вставка</button><button data-action="replace" role="menuitem" type="button">Заменить выделенное</button><button data-action="replace_from_selection" role="menuitem" type="button">Заменить на выделенное в модели</button><button data-action="regen_preview" role="menuitem" type="button">Пересоздать превью</button><button data-action="show_file" role="menuitem" type="button">Показать файл</button><button data-action="open_folder" role="menuitem" type="button">Открыть папку</button><button data-action="copy_path" role="menuitem" type="button">Копировать путь</button><button data-action="delete" class="danger-item" role="menuitem" type="button">Удалить</button></div>
    <div id="settings-backdrop" class="modal-backdrop" hidden><section class="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title"><header><h2 id="settings-title">Настройки</h2><button id="settings-close" class="icon-button" type="button" aria-label="Закрыть"><img src="../icons/close.svg" alt="" /></button></header><p id="settings-root-path"></p><label>Порог тяжёлого<input id="settings-heavy-threshold" type="number" min="1" step="1000" /></label><button id="settings-save-threshold" type="button">Сохранить порог</button><button id="settings-change-root" type="button">Изменить папку…</button><button id="settings-scan" type="button">Сканировать библиотеку</button><button id="settings-regen-all" type="button">Пересоздать все превью</button></section></div>
    <script src="app.js"></script>
  </body>
</html>
