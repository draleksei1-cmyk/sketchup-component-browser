<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Раскладка</title>
    <style>
      :root {
        --bg: #f4f8fc;
        --panel: #ffffff;
        --line: #c8d8e8;
        --text: #24415b;
        --muted: #5b7388;
        --ok: #2f7d4c;
        --danger: #a44646;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Bahnschrift", "Trebuchet MS", "Segoe UI", sans-serif;
        font-size: 12px;
      }

      .bar {
        width: 100%;
        min-height: 66px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 6px 8px;
        overflow-x: hidden;
        white-space: normal;
      }

      .group {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding-right: 8px;
        border-right: 1px solid #dbe7f3;
      }

      .group:last-child {
        border-right: 0;
        padding-right: 0;
      }

      .label { color: var(--muted); }

      button, select, input { font: inherit; }

      button {
        border: 1px solid #aec4d9;
        border-radius: 7px;
        background: #ecf5ff;
        color: #1d5078;
        cursor: pointer;
        min-height: 26px;
        padding: 3px 7px;
      }

      button:hover {
        border-color: #78a6ce;
        background: #e4f0fd;
      }

      button.action-ok {
        border-color: #8bc9a0;
        background: #e9f8ee;
        color: var(--ok);
        font-weight: 700;
      }

      button.action-cancel {
        border-color: #e0b1b1;
        background: #fdeeee;
        color: var(--danger);
        font-weight: 700;
      }

      button:disabled {
        opacity: 0.55;
        cursor: default;
      }

      select, input[type="number"] {
        height: 26px;
        border: 1px solid #bfd0e2;
        border-radius: 7px;
        background: #fff;
        color: var(--text);
        padding: 3px 6px;
      }

      input[type="number"] { width: 64px; }

      .source-name {
        max-width: 220px;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .check {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .inline-wrap {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .check input[type="checkbox"] { margin: 0; }
    </style>
  </head>
  <body>
    <div class="bar">
      <div class="group">
        <button id="source-model-btn" type="button" title="Выбрать прототип из модели">Пипетка</button>
        <button id="source-library-btn" type="button" title="Выбрать прототип из библиотеки">Библиотека</button>
      </div>

      <div class="group">
        <span class="label">Прототип:</span>
        <strong id="source-name" class="source-name">Не выбран</strong>
      </div>

      <div class="group">
        <span id="brick-controls-wrap" class="inline-wrap">
          <span class="label">Кладка:</span>
          <select id="bond-select">
            <option value="stack">Шов-в-шов</option>
            <option value="half">1/2</option>
            <option value="third">1/3</option>
          </select>
          <span class="label">Поворот кладки:</span>
          <select id="brick-layout-rotation" title="Поворот направления раскладки">
            <option value="0">0°</option>
            <option value="90">90°</option>
            <option value="180">180°</option>
            <option value="270">270°</option>
          </select>
          <span class="label">Поворот:</span>
          <select id="brick-rotation" title="Поворот кирпича">
            <option value="0">0°</option>
            <option value="90">90°</option>
            <option value="180">180°</option>
            <option value="270">270°</option>
          </select>
        </span>
      </div>

      <div class="group">
        <span class="label">X:</span>
        <input id="count-x" type="number" min="1" max="500" step="1" />
        <span class="label">Y:</span>
        <input id="count-y" type="number" min="1" max="500" step="1" />
      </div>

      <div class="group">
        <label class="check"><input id="auto-step" type="checkbox" />Авто-шаг</label>
        <span class="label">Шаг X:</span>
        <input id="step-x" type="number" min="1" step="10" title="мм" />
        <span class="label">Шаг Y:</span>
        <input id="step-y" type="number" min="1" step="10" title="мм" />
        <span class="label">Шов X:</span>
        <input id="seam-x" type="number" min="0" step="1" title="мм" />
        <span class="label">Шов Y:</span>
        <input id="seam-y" type="number" min="0" step="1" title="мм" />
      </div>

      <div class="group" id="advanced-options-group">
        <span class="label">Ориентация:</span>
        <select id="orientation-mode">
          <option value="auto">Авто</option>
          <option value="plane">По плоскости</option>
          <option value="world">По миру</option>
        </select>
        <label class="check"><input id="place-surface" type="checkbox" />На поверхность</label>
        <label id="align-normal-wrap" class="check"><input id="align-normal" type="checkbox" />По нормали</label>
        <label id="random-quadrant-wrap" class="check"><input id="random-quadrant" type="checkbox" />Случ. 0/90/180/270</label>
        <label id="drop-ground-wrap" class="check"><input id="drop-ground" type="checkbox" />К земле</label>
        <label class="check"><input id="vertical-up" type="checkbox" />Ряды вверх (Z)</label>
        <label class="check"><input id="simplify-preview" type="checkbox" />Упрощать предпросмотр</label>
      </div>

      <div class="group">
        <button id="apply-btn" class="action-ok" type="button">Применить</button>
        <button id="cancel-btn" class="action-cancel" type="button">Отмена</button>
        <button id="reset-point-btn" type="button">Сброс точки</button>
      </div>
    </div>

    <script>
      (function () {
        const state = {
          source_ready: false,
          source_name: "Не выбран",
          params: {},
        };

        const dom = {};
        let emitTimer = null;

        function ruby(name, payload) {
          if (!window.sketchup || typeof window.sketchup[name] !== "function") return;
          if (payload === undefined) {
            window.sketchup[name]();
          } else if (typeof payload === "string") {
            window.sketchup[name](payload);
          } else {
            window.sketchup[name](JSON.stringify(payload));
          }
        }

        function cacheDom() {
          dom.sourceModelBtn = document.getElementById("source-model-btn");
          dom.sourceLibraryBtn = document.getElementById("source-library-btn");
          dom.sourceName = document.getElementById("source-name");
          dom.bond = document.getElementById("bond-select");
          dom.brickLayoutRotation = document.getElementById("brick-layout-rotation");
          dom.brickRotation = document.getElementById("brick-rotation");
          dom.countX = document.getElementById("count-x");
          dom.countY = document.getElementById("count-y");
          dom.autoStep = document.getElementById("auto-step");
          dom.stepX = document.getElementById("step-x");
          dom.stepY = document.getElementById("step-y");
          dom.seamX = document.getElementById("seam-x");
          dom.seamY = document.getElementById("seam-y");
          dom.orientation = document.getElementById("orientation-mode");
          dom.placeSurface = document.getElementById("place-surface");
          dom.alignNormal = document.getElementById("align-normal");
          dom.randomQuadrant = document.getElementById("random-quadrant");
          dom.dropGround = document.getElementById("drop-ground");
          dom.verticalUp = document.getElementById("vertical-up");
          dom.simplifyPreview = document.getElementById("simplify-preview");
          dom.apply = document.getElementById("apply-btn");
          dom.cancel = document.getElementById("cancel-btn");
          dom.reset = document.getElementById("reset-point-btn");
        }

        function bindEvents() {
          dom.sourceModelBtn.addEventListener("click", () => ruby("array_select_source_model"));
          dom.sourceLibraryBtn.addEventListener("click", () => ruby("array_select_source_library"));
          dom.apply.addEventListener("click", () => ruby("array_apply"));
          dom.cancel.addEventListener("click", () => ruby("array_cancel"));
          dom.reset.addEventListener("click", () => ruby("array_reset_point"));

          const controls = [
            dom.bond,
            dom.brickLayoutRotation,
            dom.brickRotation,
            dom.countX,
            dom.countY,
            dom.autoStep,
            dom.stepX,
            dom.stepY,
            dom.seamX,
            dom.seamY,
            dom.orientation,
            dom.placeSurface,
            dom.alignNormal,
            dom.randomQuadrant,
            dom.dropGround,
            dom.verticalUp,
            dom.simplifyPreview,
          ];
          controls.forEach((control) => {
            control.addEventListener("change", scheduleEmit);
            control.addEventListener("input", scheduleEmit);
          });

          document.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
              event.preventDefault();
              ruby("array_apply");
            } else if (event.key === "Escape") {
              event.preventDefault();
              ruby("array_cancel");
            } else if (event.key === "r" || event.key === "R") {
              ruby("array_reset_point");
            }
          });
        }

        function scheduleEmit() {
          refreshDynamicDisabledState();
          if (emitTimer) window.clearTimeout(emitTimer);
          emitTimer = window.setTimeout(() => {
            emitTimer = null;
            ruby("array_params_update", collectParams());
          }, 80);
        }

        function collectParams() {
          return {
            mode: "brick",
            brick_bond: String(dom.bond.value || "stack"),
            brick_layout_rotation_deg: Number(dom.brickLayoutRotation.value || 0),
            brick_rotation_deg: Number(dom.brickRotation.value || 0),
            count_x: Number(dom.countX.value || 1),
            count_y: Number(dom.countY.value || 1),
            auto_step: !!dom.autoStep.checked,
            step_x_mm: Number(dom.stepX.value || 0),
            step_y_mm: Number(dom.stepY.value || 0),
            seam_x_mm: Number(dom.seamX.value || 0),
            seam_y_mm: Number(dom.seamY.value || 0),
            orientation_mode: String(dom.orientation.value || "auto"),
            place_on_surface: !!dom.placeSurface.checked,
            align_to_normal: !!dom.alignNormal.checked,
            random_quadrant: !!dom.randomQuadrant.checked,
            drop_to_ground: !!dom.dropGround.checked,
            vertical_up: !!dom.verticalUp.checked,
            simplify_preview: !!dom.simplifyPreview.checked,
          };
        }

        function setControlValue(control, value, asBoolean = false) {
          if (!control) return;
          if (asBoolean) {
            control.checked = !!value;
          } else {
            control.value = String(value);
          }
        }

        function refreshDynamicDisabledState() {
          const autoStep = !!dom.autoStep.checked;
          const orientation = String(dom.orientation.value || "auto");
          const verticalUp = !!dom.verticalUp.checked;

          dom.bond.disabled = false;
          dom.brickLayoutRotation.disabled = false;
          dom.brickRotation.disabled = false;
          dom.stepX.disabled = autoStep;
          dom.stepY.disabled = autoStep;
          // Шов всегда отдельный параметр (и в авто, и в ручном шаге).
          dom.seamX.disabled = false;
          dom.seamY.disabled = false;

          const allowDrop = orientation === "world" && !verticalUp;
          dom.dropGround.disabled = !allowDrop;
          dom.dropGround.title = allowDrop
            ? ""
            : "Опция недоступна при «Ряды вверх (Z)» и вне ориентации «По миру».";
          if (!allowDrop) dom.dropGround.checked = false;
        }

        function render() {
          const params = state.params || {};
          setControlValue(dom.bond, params.brick_bond || "stack");
          setControlValue(dom.brickLayoutRotation, Number(params.brick_layout_rotation_deg || 0));
          setControlValue(dom.brickRotation, Number(params.brick_rotation_deg || 0));
          setControlValue(dom.countX, Number(params.count_x || 1));
          setControlValue(dom.countY, Number(params.count_y || 1));
          setControlValue(dom.autoStep, !!params.auto_step, true);
          setControlValue(dom.stepX, Number(params.step_x_mm || 0));
          setControlValue(dom.stepY, Number(params.step_y_mm || 0));
          setControlValue(dom.seamX, Number(params.seam_x_mm || 0));
          setControlValue(dom.seamY, Number(params.seam_y_mm || 0));
          setControlValue(dom.orientation, params.orientation_mode || "auto");
          setControlValue(dom.placeSurface, !!params.place_on_surface, true);
          setControlValue(dom.alignNormal, !!params.align_to_normal, true);
          setControlValue(dom.randomQuadrant, !!params.random_quadrant, true);
          setControlValue(dom.dropGround, !!params.drop_to_ground, true);
          setControlValue(dom.verticalUp, !!params.vertical_up, true);
          setControlValue(dom.simplifyPreview, !!params.simplify_preview, true);

          dom.sourceName.textContent = String(state.source_name || "Не выбран");
          dom.apply.disabled = !state.source_ready;

          refreshDynamicDisabledState();
        }

        function applyIncomingState(nextState) {
          state.source_ready = !!(nextState && nextState.source_ready);
          state.source_name = nextState && nextState.source_name ? String(nextState.source_name) : "Не выбран";
          state.params = nextState && nextState.params ? nextState.params : {};
          render();
        }

        window.ArrayPalette = {
          setState(nextState) {
            applyIncomingState(nextState || {});
          },
        };

        document.addEventListener("DOMContentLoaded", () => {
          cacheDom();
          bindEvents();
          ruby("array_palette_ready");
        });
      })();
    </script>
  </body>
</html>
